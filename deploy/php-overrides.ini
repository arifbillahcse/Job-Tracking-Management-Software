; Put in /etc/php/8.3/fpm/conf.d/90-job-tracker.ini (and .../cli/conf.d/ for the cron scripts), then restart PHP-FPM.
; Production values for Job Tracker. Checked by `php cli/doctor.php`.

upload_max_filesize = 6M        ; the application accepts 5 MB imports
post_max_size = 8M
memory_limit = 256M             ; exports stream in chunks, so this is generous
max_execution_time = 60

display_errors = Off            ; errors go to the log, never to the browser
log_errors = On
expose_php = Off
html_errors = Off

date.timezone = UTC             ; the app stores UTC and converts for display using its own setting

session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_only_cookies = 1

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

allow_url_fopen = Off
